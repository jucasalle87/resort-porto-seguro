# ESTE ARQUIVO É SÓ UM MODELO — não é lido automaticamente pelo app.
#
# Pra rodar LOCAL: copie este conteúdo (preenchido) para .streamlit/secrets.toml
# Pra rodar no STREAMLIT CLOUD: cole este conteúdo (preenchido) em
#   Manage app > Settings > Secrets
#
# Sem isso configurado, o app funciona normalmente, mas usuários cadastrados
# e o log de acesso ficam só no disco local do container — e se perdem
# quando o Streamlit Cloud reinicia (redeploy ou muito tempo sem uso).
# Com isso configurado, tudo é sincronizado com o repositório GitHub e
# sobrevive a qualquer restart, do mesmo jeito que já funciona nos outros
# portais DarkPool (ex.: Fazenda Barra II).
#
# Como gerar o token:
#   1. github.com > Settings (da sua conta) > Developer settings >
#      Personal access tokens > Fine-grained tokens > Generate new token
#   2. Repository access: só o repositório deste dataroom
#   3. Permissions: Contents > Read and write
#   4. Copie o token gerado (começa com "github_pat_" ou "ghp_") pra cá

[github]
token = "COLE_AQUI_O_TOKEN_DO_GITHUB"
repo = "seu-usuario-github/nome-do-repositorio"
branch = "main"
